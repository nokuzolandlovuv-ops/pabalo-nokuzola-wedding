<!DOCTYPE html>
<html lang="en">

<title>Pabalo & Nokuzola | Wedding Invitation</title>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#f8f5ed;
  color:#34483d;
  font-family:"Cormorant Garamond",serif;
  text-align:center;
  line-height:1.6;
}

.page{
  width:100%;
  min-height:100vh;
  overflow:hidden;
}

.hero{
  min-height:100vh;
  padding:60px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:

    radial-gradient(circle at top left,#d8e3d8,transparent 35%),
    radial-gradient(circle at bottom right,#e5d6a7,transparent 35%);
  position:relative;
}

.flower{
  position:absolute;
  font-size:45px;
  opacity:.75;
}

.flower.one{
  top:25px;
  left:20px;
}

.flower.two{
  top:35px;
  right:20px;
}

.flower.three{
  bottom:25px;
  left:20px;
}

.flower.four{
  bottom:30px;
  right:20px;
}

.monogram{
  width:115px;
  height:115px;

  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Great Vibes",cursive;
  font-size:48px;
  color:#b08b3e;
  margin-bottom:25px;
  box-shadow:0 0 0 7px rgba(184,155,85,.12);
}

.small{
  letter-spacing:4px;
  text-transform:uppercase;
  font-size:15px;
  color:#7d8e82;
}

.names{
  font-family:"Great Vibes",cursive;

}

.amp{

  font-size:38px;
  font-family:"Great Vibes",cursive;
}

.quote{

  font-size:21px;
  color:#68776e;
}

.gold-line{
  width:100px;
  height:2px;
  background:#b89b55;
  margin:25px auto;
}

.section{
  padding:65px 22px;
  max-width:850px;
  margin:auto;
}

.title{
  font-family:"Great Vibes",cursive;
  font-size:45px;
  color:#40584a;
  margin-bottom:20px;
}

.info{
  background:rgba(255,255,255,.65);
  border:1px solid rgba(184,155,85,.45);
  border-radius:25px;
  padding:30px 20px;
  margin:20px auto;
  max-width:650px;
  box-shadow:0 10px 30px rgba(52,72,61,.08);
}

.info h3{
  color:#b08b3e;
  margin-bottom:5px;
  font-size:20px;
}

.info p{
  font-size:20px;
}

.dress{
  font-size:23px;
  margin-top:15px;
}

.notice{
  margin:30px auto;
  padding:20px;
  border-top:1px solid #b89b55;
  border-bottom:1px solid #b89b55;
  max-width:600px;
  font-size:21px;
  color:#4d6255;
}

.verse{
  font-style:italic;
  font-size:22px;
  max-width:650px;
  margin:auto;
}

.gifts{
  font-size:20px;
  max-width:650px;
  margin:auto;
}

form{
  max-width:600px;
  margin:30px auto 0;
  text-align:left;
}

label{
  display:block;
  margin:15px 0 6px;
  font-size:18px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #b7c5b9;
  border-radius:12px;
  background:#fffdf8;
  font-family:inherit;
  font-size:17px;
  color:#34483d;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:30px;
  background:#40584a;
  color:white;
  font-family:"Cormorant Garamond",serif;
  font-size:20px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#b08b3e;
}

#msg{
  text-align:center;
  margin-top:15px;
  color:#40584a;
  font-size:18px;
}

.footer{
  padding:50px 20px;
  background:#40584a;
  color:#f8f5ed;
}

.footer .names{
  color:#f8f5ed;
  font-size:45px;
}
